name: Desplegar a Hostinger

# La web la sirve una app Node.js de Hostinger (server.mjs + Express + public/).
# Cada push a main que toque la web regenera public/ con build.mjs, lo sube con server.mjs por FTP
# y reinicia la app. Así un cambio en src/ se publica aunque no se haya ejecutado "npm run generar"
# en local; si faltan traducciones, build.mjs falla y no se sube nada.
# Hostinger no deja conectar Git a esta app (se gestiona con acceso delegado), por eso va por FTP.
#
# Requiere 3 secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER · FTP_USERNAME · FTP_PASSWORD  (hPanel -> Archivos -> Cuentas FTP)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "assets/**"
      - "photos/**"
      - "build.mjs"
      - "server.mjs"
      - "tools/deploy-ftp.mjs"
      - "tools/indexnow.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Subir public/ y server.mjs a Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # para saber qué páginas han cambiado (IndexNow)

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar la web (build.mjs)
        run: node build.mjs

      - name: Subir por FTP y reiniciar la app
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          npm install basic-ftp@5 --no-save --no-fund --no-audit --silent
          node tools/deploy-ftp.mjs

      # Solo si el despliegue ha ido bien. Avisa a Bing, Yandex y demás de las páginas cambiadas.
      # Nunca pone el job en rojo: si falla, deja un aviso amarillo y ya está.
      - name: Avisar a los buscadores (IndexNow)
        env:
          BEFORE: ${{ github.event.before }}
        run: node tools/indexnow.mjs
